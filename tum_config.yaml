
%YAML: 1.0

dataDir: /home/laijinxiang/docker-0105/dataset/TUMdataset/rgbd_dataset_freiburg2_xyz # /home/laijinxiang/edge-slam/rgbd_dataset_freiburg2_xyz # /home/laijinxiang/docker-0105/dataset/TUMdataset/rgbd_dataset_freiburg1_desk2 # 
# "/home/laijinxiang/edge-slam/bdj3-record_data-i" 
# "/home/laijinxiang/docker-0105/dataset/0524-test-18/bdj3-record_data-i"

Camera.model: "pinhole"

# fr1
# Camera.intrinstic: [517.3, 318.6, 516.5, 255.3] # fx cx fy cy
# Camera.distortion: [0.2624, -0.9531, -0.0054, 0.0026, 1.1633] # d0, d1, d2, d3, d4

# fr2
Camera.intrinstic: [520.9, 325.1, 521.0, 249.7] # fx cx fy cy
Camera.distortion: [0.2312, -0.7849, -0.0033, -0.0001, 0.9172] # d0, d1, d2, d3, d4
# Camera.distortion: [0., 0., 0.0, 0.0, 0.] # d0, d1, d2, d3, d4


Qcg: [0, 0, 0, 1] # qx qy qz qw
Pcg: [0, 0, 0] # tx ty tz

Camera.imageScale: 1.0
wheelRadius: 0

maxDepth: 150.0 # 影响重投影匹配，需要设置大点
minDepth: 0.1

maxDescriptorDist: 20 # or 使用光度残差时重新设置
goodDescriptorDistRatio: 0.6 # 使用 ratio * maxDescriptorDist来判断跟踪效果
maxTrackProjectPixelError: 4.0 # 2.0 跟踪成功的条件是重投影dt残差阈值在该范围内

maxDepthConvergeStd: 0.5 # 深度收敛的标准差
abnormalProjectResidual: 5 # 15个像素距离为异常残差值，不能参与优化步骤
huberDelta: 4 # 胡伯核函数参数
keepLastKFnumInWindow: 3 # 滑窗内KF数量控制
maxKFnumInWindow: 1
imgTimeOffset: 0.0 # sec,时间同步误差
needNewKFtrans: 0.3 # 选取新KF的条件
needNewKFrot: 5.0 # deg
needNewKFMaxMatchEdgeRatio: 0.2 # 匹配边缘点数量小于该阈值时，需要选定新KF
# TODO: 这个误差模型将极大的影响深度估计，这里直接是将其当作误差角度使用，值为1时不行
filterPixelError: 10 # 按1个像素误差推导深度三角化不确定度
maxIteration: 30 # LM算法迭代次数

messageLevel: 1 # 0-debug, 1-info, 2-error
maxActiveLandmarkEachKF: 500


fastTh: 7 # 角点，暂不启用，目标是仅利用边缘点
fastNum: 0

relativePoseConstraintWeight: 1 # 先验Hp已经包含了对各pose的约束，所以其实上不需要该约束，除了先验约束值为0的情况

maxKeepEpilorMatchPointNum: 3 # 3极线约束取最匹配的数量

useInvZ: false
showDebugImg: false
firstImgIdx: 0
loopClosureImgIdx: 10

cannyLowerTh: 60 # 150
cannyupperTh: 80 # 160

# 存在相邻边缘像素被匹配的情况
minSearchStep: 1 # 与深度有关系，深度大时，视野大，增大该值，深度小时，视野小减小该值，但是由于有边缘特征，所以还是直接按逐个像素点搜索？
minDepthCompareRatio: 0.7
maxDepthCompareRatio: 1.4
pyrLevel: 1

minGoodTriangulateAngle: 0.1 # deg, 使用深度滤波时不在意视差
maxGoodTriangulateAngle: 120.0
minTranslation: 0.5 # m, 每隔多少米取1帧图像进行三角化，视差过小时，三角化的距离受噪声影响极大[LSD-SLAM]
nonMaximumSuppressionRatio: 1.0 # 为了减小误匹配，设定最优与次优描述子的比值，暂未启用
descriptorPatchLen: 5
minEpipolarSearchLine: 5
maxEpipolarSearchLine: 30 # most import item for triangulation
best2SecondRatio: 0.9
best2SecondDist: 1 # pixels
SimErrorRatio: 0.0 # 千分之5
drawGoddEpipolarMatch: false
drawAllEpipolarMatch: false
drawEpipolarMatchStartCol: 300
